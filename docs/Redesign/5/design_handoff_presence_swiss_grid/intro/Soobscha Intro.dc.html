<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>window.OM_SCENES = '[{"name":"Scatter","dur":0.5,"desc":"Six letters appear scattered across the empty screen"},{"name":"Gather","dur":0.9,"desc":"The letters slide together into the word сообща"},{"name":"Sign","dur":0.7,"desc":"A rule draws under the word and the address soobscha.ru appears"},{"name":"Open","dur":1.5,"desc":"The word shrinks into the header; the feed fades in"}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"times","count":1}';</script>
<style>
  body{margin:0;background:#DEDBD4;font-family:'Archivo',sans-serif;color:#111}
  a{color:#111;text-decoration:underline}
  a:hover{color:#E2231A}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
  <x-import component-from-global-scope="CompositionStage" from="./animations-v3.jsx ./soobscha-intro.jsx" width="1440" height="900" bg="#F2F0EC" scenes="{{ scenes }}" playback="{{ playback }}" hint-size="100%,600px">
    <x-import component-from-global-scope="SoobschaIntro" hint-size="100%,100%"></x-import>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { scenes: window.OM_SCENES, playback: window.OM_PLAYBACK };
  }
}
</script>
</body>
</html>
